  <rect x="15" y="10" width="70" height="80" rx="8" fill="#2563eb" />
  <!-- Linhas simulando o texto do orçamento -->
  <path d="M30 30 h40 M30 50 h40 M30 70 h15" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
